# =====================================================================
# 取材候補ソーシング 設定ファイル（人が編集してOKの場所）
# ※ ここは「どのエリアを、どんな条件で探すか」を決める設定です。
#    プログラムの知識がなくても、数字や地名を書き換えるだけで調整できます。
# =====================================================================

area:
  name: "品川 港南/北品川/東品川エリア"

  # --- 検索する円 ---------------------------------------------------
  # Google の店舗検索は「中心点＋半径」の円で行います。
  # エリア全体を覆うように円を並べます。取りこぼしがあれば円を増やしてください。
  # lat=緯度, lng=経度, radius_m=半径(メートル)
  search_circles:
    - { lat: 35.6285, lng: 139.7407, radius_m: 500 }   # 品川駅 港南口あたり
    - { lat: 35.6235, lng: 139.7420, radius_m: 500 }   # 北品川/東品川あたり
    - { lat: 35.6320, lng: 139.7460, radius_m: 450 }   # 港南の海側

  # --- 対象エリアの境界（近似ポリゴン）-----------------------------
  # この多角形の「内側」にある店だけを候補にします。
  # [緯度, 経度] の点を、エリアの外周に沿って順番に並べます。
  # v1は近似です。地図と見比べてズレていたら点を足し引きしてください。
  polygon:
    - [35.6335, 139.7385]
    - [35.6340, 139.7475]
    - [35.6180, 139.7490]
    - [35.6170, 139.7400]

candidates:
  per_run: 12              # 1回（週1）の提案件数の「上限」（10〜15推奨）
  min_score: 0.5           # このスコア未満は提案しない（枠を埋めるためにチェーン等を出さない）
                           # → 良い店が尽きたら件数が減るだけで、カスは提案されません
  min_rating_reviews: 5    # この口コミ数未満は「評価」を信用しすぎない
  new_store_max_reviews: 15  # 口コミがこの数以下なら「新店の可能性あり」と扱う
  hidden_gem_max_reviews: 40 # 高評価×口コミ少なめ＝穴場 と判定する口コミ上限

places:
  # 探す業種（Google の種別）。不要なものは消してOK。
  included_types: [restaurant, cafe, bakery, bar, meal_takeaway, meal_delivery]
  language: ja
  region: JP
  # チェーン判定で「同名店が全国に何件あるか」を毎回調べると料金が増えます。
  # true にすると精度が上がりますが API 料金が増えます。まずは false 推奨。
  enable_nationwide_chain_check: false
