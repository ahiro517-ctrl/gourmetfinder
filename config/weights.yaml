# =====================================================================
# スコアの重み（学習で自動調整されます。手で書き換えてもOK）
# ※ スプレッドシートのフィードバック(○/△/×)を読んで、週次で自動更新されます。
#    値が大きいほど、その要素を重視して順位付けします。
# =====================================================================

weights:
  new_store: 3.0       # 新店オープンの可能性
  rating: 2.0          # 評価の高さ
  hidden_gem: 1.5      # 高評価×口コミ少なめ（穴場）
  independent: 1.5     # 独立系（チェーンでない独自性）
  chain_penalty: -2.0  # 全国チェーンは優先度を下げる（マイナス＝減点）

# 学習の強さ（1件のフィードバックで重みをどれだけ動かすか）
learning_rate: 0.3

# 重みが極端になりすぎないための上限・下限
bounds:
  min: -5.0
  max: 5.0
