name: 取材候補ソーシング（週次）

# 毎週月曜 09:00 JST（00:00 UTC）に自動実行。
# 「Actions」タブで本ワークフローを選び、"Run workflow" ボタンから手動実行もできます。
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # 学習後の重み(config/*.yaml)をリポジトリに保存するため

jobs:
  source-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 候補出しを実行
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOURMET_SPREADSHEET_ID: ${{ secrets.GOURMET_SPREADSHEET_ID }}
        run: python -m gourmetfinder

      - name: 学習結果(重み)を保存
        run: |
          if [ -n "$(git status --porcelain config/)" ]; then
            git config user.name "gourmetfinder-bot"
            git config user.email "actions@github.com"
            git add config/weights.yaml config/chains.yaml
            git commit -m "chore: フィードバック学習による重み更新"
            git push
          else
            echo "重みの更新はありませんでした。"
          fi
